# jisha.ai-rocket-experiments.com — Flux AI interview platform.
#
# Name-based virtual host: this block serves ONLY requests whose Host header
# matches server_name. It deliberately does not include /etc/nginx/apps-enabled/*,
# so the path-mounted POCs on the default server (e.g. /miq) are not reachable
# here. Copy this file per POC to give each one its own subdomain.
#
#   /      -> Next.js app        127.0.0.1:3040
#   /gw/   -> voice gateway      127.0.0.1:8787  (WebSocket + recording uploads)

server {
    listen 80;
    listen [::]:80;
    server_name jisha.ai-rocket-experiments.com;

    # certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 on the listen line — nginx 1.18 (Ubuntu 22.04) has no standalone directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jisha.ai-rocket-experiments.com;

    ssl_certificate     /etc/letsencrypt/live/jisha.ai-rocket-experiments.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jisha.ai-rocket-experiments.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/jisha.ai-rocket-experiments.com/chain.pem;

    # Interview recordings post in ~10s chunks; leave generous headroom.
    client_max_body_size 200m;

    # Voice gateway. The trailing slash on proxy_pass strips the /gw prefix,
    # so /gw/ws -> /ws and /gw/upload/<token>/chunk -> /upload/<token>/chunk.
    location /gw/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A live interview holds one socket open for the whole session.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
